[project]
name = "de-la-glosa-a-la-calle"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "pydantic>=2.0.0",
  "duckdb>=0.10.0",
  "pandas>=2.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
